name: lingiux_app
description: App de aprendizaje de idiomas - Lingiux
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegación
  go_router: ^14.6.2

  # Backend (Fase 2+)
  supabase_flutter: ^2.9.1

  # Inyección de dependencias (Fase 2+)
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Manejo de errores funcional
  fpdart: ^1.1.0

  # Imágenes (Fase 3+)
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utils
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  audioplayers: ^6.7.1
  record: ^6.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  injectable_generator: ^2.7.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/sounds/
    - assets/flags/
